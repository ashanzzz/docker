name: nextcloud-full sync & build

on:
  schedule:
    - cron: "0 3 1 * *" # Runs at 03:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if version unchanged"
        type: boolean
        required: false
        default: false
      target_version:
        description: "Specify Nextcloud version (leave blank to auto-detect latest upstream)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - 'nextcloud/**'
      - '.github/workflows/nextcloud*.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: nextcloud-full-ci-sync-build
  cancel-in-progress: false

jobs:
  sync_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream Nextcloud version
        id: upstream
        run: |
          TARGET="${{ inputs.target_version }}"
          if [ -n "$TARGET" ]; then
            echo "Using specified target version: $TARGET"
            echo "version=$TARGET" >> "$GITHUB_OUTPUT"
          else
            UPSTREAM=$(curl -fsSL https://raw.githubusercontent.com/nextcloud/docker/master/versions.json | python3 -c "import sys, json; data=json.load(sys.stdin); m=max(int(k) for k in data.keys() if k.isdigit()); print(data[str(m)]['version'])")
            echo "Resolved upstream version: $UPSTREAM"
            echo "version=$UPSTREAM" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify upstream base image tag exists
        run: |
          docker run --rm quay.io/skopeo/stable:v1.15.0 inspect "docker://docker.io/library/nextcloud:${{ steps.upstream.outputs.version }}-apache" >/dev/null

      - name: Compare versions
        id: diff
        run: |
          CURRENT=""
          if [ -f nextcloud/image-full/NEXTCLOUD_VERSION ]; then
            CURRENT="$(cat nextcloud/image-full/NEXTCLOUD_VERSION | tr -d '\r\n')"
          fi
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          FORCE="${{ inputs.force }}"
          EVENT="${{ github.event_name }}"
          echo "Current: '$CURRENT', Upstream: '$UPSTREAM', Force: '$FORCE', Event: '$EVENT'"
          if [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ] || [ "$CURRENT" != "$UPSTREAM" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update NEXTCLOUD_VERSION (if changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p nextcloud/image-full
          echo "${{ steps.upstream.outputs.version }}" > nextcloud/image-full/NEXTCLOUD_VERSION

      - name: Commit & push version bump (if changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nextcloud/image-full/NEXTCLOUD_VERSION
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(nextcloud-full): bump nextcloud to ${{ steps.upstream.outputs.version }}"
            git push
          fi

      - name: Read repo version
        id: v
        run: |
          VER="$(cat nextcloud/image-full/NEXTCLOUD_VERSION | tr -d '\r\n')"
          MAJOR="$(echo "$VER" | cut -d. -f1)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./nextcloud/image-full
          push: true
          platforms: linux/amd64
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.v.outputs.ver }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextcloud-full:${{ steps.v.outputs.ver }}-apache-full
            ghcr.io/${{ github.repository_owner }}/nextcloud-full:${{ steps.v.outputs.major }}-apache-full
            ghcr.io/${{ github.repository_owner }}/nextcloud-full:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.nextcloud.version=${{ steps.v.outputs.ver }}

      - name: Create git tag
        if: steps.diff.outputs.changed == 'true'
        run: |
          TAG="nextcloud-full-v${{ steps.v.outputs.ver }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists: $TAG"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
