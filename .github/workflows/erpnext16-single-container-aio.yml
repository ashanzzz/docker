name: Build ERPNext16 External AIO

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/erpnext16-single-container-aio.yml"
      - "erpnext16/**"
  workflow_dispatch:
    inputs:
      version:
        description: "ERPNext v16 tag, e.g. v16.32.0. Empty = latest official v16.x.y."
        required: false
      force_rebuild:
        description: "Disable Docker cache for this build"
        type: boolean
        required: false
        default: false
      upload_image_artifact:
        description: "Export a docker image tar.gz artifact"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "41 2 1 * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: erpnext16-external-aio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Avoid a second build caused by this workflow committing ERPNEXT_VERSION.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout docker repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve ERPNext v16 version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ github.event.inputs.version }}"
          if [[ -n "$REQUESTED" ]]; then
            VERSION="$REQUESTED"
          else
            pattern='^v?16\.[0-9]+\.[0-9]+$'
            url='https://hub.docker.com/v2/repositories/frappe/erpnext/tags?page_size=100'
            tmp="$(mktemp)"
            : > "$tmp"

            for _ in $(seq 1 20); do
              payload="$(curl -fsSL "$url")"
              echo "$payload" | jq -r '.results[].name' | grep -E "$pattern" >> "$tmp" || true
              url="$(echo "$payload" | jq -r '.next // empty')"
              [[ -z "$url" || "$url" == "null" ]] && break
            done

            VERSION="$(sort -V "$tmp" | tail -n1 || true)"
            rm -f "$tmp"

            [[ -n "$VERSION" ]] || {
              echo "::error::Could not resolve an official ERPNext v16 tag."
              exit 1
            }
          fi

          [[ "$VERSION" == v* ]] || VERSION="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ERPNext: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracked ERPNext version
        id: tracked
        shell: bash
        run: |
          set -euo pipefail

          FILE="erpnext16/ERPNEXT_VERSION"
          VERSION="${{ steps.version.outputs.version }}"
          CURRENT="$(tr -d '\r\n' < "$FILE" 2>/dev/null || true)"

          if [[ "$CURRENT" != "$VERSION" ]]; then
            printf '%s\n' "$VERSION" > "$FILE"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit tracked version update
        if: ${{ steps.tracked.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add erpnext16/ERPNEXT_VERSION
          git commit -m "chore(erpnext16): track ${{ steps.version.outputs.version }}"
          git push

      - name: Fetch Ashan app
        shell: bash
        env:
          ASHAN_REPO_REF: main
          ASHAN_REPO_TOKEN: ${{ secrets.ASHAN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x erpnext16/scripts/fetch-ashan-custom-app.sh
          erpnext16/scripts/fetch-ashan-custom-app.sh

      - name: Verify Ashan source
        id: ashan
        shell: bash
        run: |
          set -euo pipefail

          APP="erpnext16/custom-apps/ashan_cn_procurement"

          test -f "$APP/pyproject.toml"
          test -f "$APP/ashan_cn_procurement/hooks.py"
          test -f "$APP/.ashan-source-commit"

          SHA="$(tr -d '\r\n' < "$APP/.ashan-source-commit")"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid Ashan commit marker: $SHA"
            exit 1
          }

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "Ashan: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Build ERPNext apps manifest
        id: apps
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          MANIFEST="erpnext16/apps.json"

          test -f "$MANIFEST"

          BASE64="$(
            jq --arg ver "$VERSION" \
              'map(if (.url | endswith("/erpnext")) then .branch=$ver else . end)' \
              "$MANIFEST" |
            (base64 -w 0 2>/dev/null || base64 | tr -d '\n')
          )"

          echo "base64=$BASE64" >> "$GITHUB_OUTPUT"

      - name: Resolve compatible Frappe ref
        id: frappe
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          if git ls-remote --exit-code --tags \
              https://github.com/frappe/frappe \
              "refs/tags/${VERSION}" >/dev/null 2>&1; then
            REF="$VERSION"
          else
            REF="version-16"
            echo "::warning::Frappe tag ${VERSION} does not exist; using version-16."
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Frappe: $REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve image trace tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./erpnext16
          file: ./erpnext16/single-aio/Containerfile
          push: true
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
          cache-from: type=gha,scope=erpnext16-external-aio
          cache-to: type=gha,mode=max,scope=erpnext16-external-aio
          build-args: |
            FRAPPE_IMAGE_TAG=version-16
            FRAPPE_BRANCH=${{ steps.frappe.outputs.ref }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            APPS_JSON_BASE64=${{ steps.apps.outputs.base64 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-external-aio
            com.ashan.erpnext.architecture=external-db-redis-only
            com.ashan.erpnext.custom-app.ref=main
            com.ashan.erpnext.custom-app.revision=${{ steps.ashan.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/erpnext16:latest
            ghcr.io/${{ github.repository_owner }}/erpnext16:aio
            ghcr.io/${{ github.repository_owner }}/erpnext16:${{ steps.version.outputs.version }}-aio
            ghcr.io/${{ github.repository_owner }}/erpnext16:sha-${{ steps.meta.outputs.short_sha }}-aio

      - name: Pull and validate published image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/erpnext16:${{ steps.version.outputs.version }}-aio"
          docker pull "$IMAGE"

          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -lc '
              set -euo pipefail

              cd /home/frappe/frappe-bench

              env/bin/python -c "import frappe; import erpnext; import ashan_cn_procurement"

              python3 -c '"'"'from pathlib import Path; apps=Path("sites/apps.txt").read_text().splitlines(); expected=["frappe","erpnext","ashan_cn_procurement"]; assert apps == expected, (apps, expected)'"'"'

              test -f /usr/local/bin/entrypoint.sh
              test ! -e /etc/supervisor/conf.d/00-mariadb.conf
              test ! -e /etc/supervisor/conf.d/00-redis.conf
              test ! -e /usr/local/bin/run-mariadb.sh
              test ! -e /usr/local/bin/run-redis.sh

              echo "External-only AIO image validation passed."
            '

      - name: Export image artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_image_artifact }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/erpnext16:${{ steps.version.outputs.version }}-aio"
          OUT="/tmp/erpnext16-${{ steps.version.outputs.version }}-aio.docker.tar.gz"

          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > "$OUT"
          ls -lh "$OUT"

      - name: Upload image artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_image_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: erpnext16-${{ steps.version.outputs.version }}-aio-docker-image
          path: /tmp/erpnext16-${{ steps.version.outputs.version }}-aio.docker.tar.gz
          if-no-files-found: error
          compression-level: 0
