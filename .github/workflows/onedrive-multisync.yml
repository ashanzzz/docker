name: Build & Publish onedrive-multisync

on:
  schedule:
    - cron: "0 3 1 * *" # Runs at 03:00 UTC on the 1st of every month
  push:
    branches: [ "main", "master" ]
    paths:
      - "onedrive-multisync/**"
      - ".github/workflows/onedrive-multisync.yml"
  pull_request:
    paths:
      - "onedrive-multisync/**"
  workflow_dispatch:
    inputs:
      runtime_engine:
        description: "Supervisor runtime engine (rust or python)"
        required: false
        default: "rust"
        type: choice
        options:
          - rust
          - python

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ashanzzz/onedrive-multisync

jobs:
  test-python-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onedrive-multisync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic state machine & REST API integration tests
        run: python3 -m unittest discover -s tests -v

  build-and-push:
    needs: test-python-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./onedrive-multisync
          file: ./onedrive-multisync/${{ inputs.runtime_engine == 'python' && 'Dockerfile.python' || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
