[package]
name = "onedrive-multisync"
version = "1.0.0"
edition = "2021"
description = "Enterprise single-container multi-account OneDrive bidirectional sync & self-healing gateway"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
